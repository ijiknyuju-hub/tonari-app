<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>concept: 料理の夜空</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    background: #FAF6F0; color: #2B2725; max-width: 375px; margin: 0 auto;
    min-height: 100vh; padding-bottom: 76px;
  }
  header { padding: 28px 20px 12px; }
  .eyebrow { font-size: 12px; font-weight: 700; color: rgba(43,39,37,.55); letter-spacing: .08em; }
  h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
  .sub { font-size: 13px; color: rgba(43,39,37,.6); margin-top: 6px; }
  .sky {
    margin: 6px 12px 0; border-radius: 22px; overflow: hidden;
    background: #1D2440; box-shadow: 0 4px 18px rgba(29,36,64,.25); position: relative;
  }
  .sky-note {
    position: absolute; top: 14px; left: 14px; background: rgba(250,246,240,.12);
    border: 1px solid rgba(250,246,240,.22); color: #F5EFE4; border-radius: 10px;
    padding: 7px 11px; font-size: 11.5px; line-height: 1.5; backdrop-filter: blur(2px);
  }
  .sky-note b { color: #FFD98A; }
  .sheet {
    position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
    width: 359px; background: #fff; border-radius: 18px 18px 0 0;
    box-shadow: 0 -6px 24px rgba(43,39,37,.14); padding: 14px 16px 16px;
  }
  .sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: #E5DDD2; margin: 0 auto 12px; }
  .sheet-row { display: flex; gap: 14px; align-items: center; }
  .thumb { width: 76px; height: 76px; border-radius: 14px; background: linear-gradient(135deg,#F5E3D7,#FDEFE2);
    display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; }
  .sheet h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .sheet .diff { font-size: 12.5px; color: rgba(43,39,37,.62); margin-top: 3px; line-height: 1.5; }
  .sheet .meta { font-size: 12px; color: rgba(43,39,37,.5); margin-top: 4px; }
  .cta { display: block; width: 100%; margin-top: 12px; background: #C8531C; color: #fff;
    border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 700; }
  nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 375px;
    background: #fff; border-top: 1px solid #EFE8DE; display: flex; height: 56px; }
  nav div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10.5px; color: rgba(43,39,37,.5); gap: 2px; }
  nav div.on { color: #C8531C; font-weight: 700; }
  nav .ic { font-size: 18px; line-height: 1; }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">となりごはん</div>
    <h1>わたしの料理の夜空</h1>
    <div class="sub">星12・星座2つ — 唐揚げ座が形になってきました</div>
  </header>

  <div class="sky">
    <div class="sky-note"><b>✦ 新しい星が3つ点灯</b><br>ナンプラーを手に入れました</div>
    <svg viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg">
      <circle cx="46" cy="52" r="1" fill="#F5EFE4" opacity=".35"/>
      <circle cx="312" cy="38" r="1.2" fill="#F5EFE4" opacity=".3"/>
      <circle cx="120" cy="30" r="1" fill="#F5EFE4" opacity=".25"/>
      <circle cx="200" cy="66" r="1.4" fill="#F5EFE4" opacity=".3"/>
      <circle cx="330" cy="200" r="1.2" fill="#F5EFE4" opacity=".3"/>
      <circle cx="30" cy="300" r="1" fill="#F5EFE4" opacity=".3"/>
      <circle cx="90" cy="370" r="1.2" fill="#F5EFE4" opacity=".25"/>
      <circle cx="280" cy="380" r="1" fill="#F5EFE4" opacity=".3"/>

      <g stroke="#8FA3D9" stroke-width="1.4" opacity=".85">
        <line x1="60" y1="120" x2="128" y2="88"/>
        <line x1="128" y1="88" x2="188" y2="128"/>
        <line x1="188" y1="128" x2="150" y2="180"/>
      </g>
      <circle cx="60" cy="120" r="7" fill="#FFE9B8"/>
      <circle cx="60" cy="120" r="12" fill="none" stroke="#FFE9B8" stroke-width="1" opacity=".4"/>
      <text x="60" y="142" font-size="10.5" font-weight="700" text-anchor="middle" fill="#EADFCB">唐揚げ</text>
      <circle cx="128" cy="88" r="5.5" fill="#FFE9B8"/>
      <text x="128" y="74" font-size="10" text-anchor="middle" fill="#EADFCB">油淋鶏</text>
      <circle cx="188" cy="128" r="5.5" fill="#FFE9B8"/>
      <text x="212" y="124" font-size="10" fill="#EADFCB">チキン南蛮</text>
      <circle cx="150" cy="180" r="4" fill="#fff" opacity=".92"/>
      <circle cx="150" cy="180" r="8" fill="none" stroke="#fff" stroke-width="1" opacity=".5"/>
      <text x="150" y="200" font-size="10" text-anchor="middle" fill="#BFCBE8">タンドリー</text>
      <text x="106" y="52" font-size="11" font-weight="800" fill="#93A8DE" letter-spacing=".1em">─ 唐揚げ座 ─</text>

      <g stroke="#8FA3D9" stroke-width="1.4" opacity=".85">
        <line x1="70" y1="290" x2="140" y2="260"/>
        <line x1="140" y1="260" x2="205" y2="292"/>
      </g>
      <circle cx="70" cy="290" r="7" fill="#FFE9B8"/>
      <text x="70" y="312" font-size="10.5" font-weight="700" text-anchor="middle" fill="#EADFCB">チャーハン</text>
      <circle cx="140" cy="260" r="5.5" fill="#FFE9B8"/>
      <text x="140" y="246" font-size="10" text-anchor="middle" fill="#EADFCB">キムチ炒飯</text>
      <text x="120" y="330" font-size="11" font-weight="800" fill="#93A8DE" letter-spacing=".1em">─ チャーハン座 ─</text>

      <g>
        <circle cx="205" cy="292" r="8" fill="#7BE3A8"/>
        <circle cx="205" cy="292" r="14" fill="none" stroke="#7BE3A8" stroke-width="1.4" opacity=".55"/>
        <circle cx="205" cy="292" r="20" fill="none" stroke="#7BE3A8" stroke-width="1" opacity=".25"/>
        <text x="205" y="322" font-size="11" font-weight="800" text-anchor="middle" fill="#A9F0C8">ガパオライス ✦</text>
      </g>
      <g>
        <circle cx="278" cy="180" r="6" fill="#7BE3A8"/>
        <circle cx="278" cy="180" r="11" fill="none" stroke="#7BE3A8" stroke-width="1.2" opacity=".5"/>
        <text x="278" y="162" font-size="10" text-anchor="middle" fill="#A9F0C8">フォー ✦</text>
      </g>
      <g>
        <circle cx="310" cy="300" r="6" fill="#7BE3A8"/>
        <circle cx="310" cy="300" r="11" fill="none" stroke="#7BE3A8" stroke-width="1.2" opacity=".5"/>
        <text x="310" y="324" font-size="10" text-anchor="middle" fill="#A9F0C8">ヤムウンセン ✦</text>
      </g>

      <circle cx="255" cy="80" r="3" fill="#fff" opacity=".45"/>
      <text x="255" y="64" font-size="9.5" text-anchor="middle" fill="#7C89AE">パッタイ</text>
      <circle cx="52" cy="215" r="3" fill="#fff" opacity=".45"/>
      <text x="52" y="232" font-size="9.5" text-anchor="middle" fill="#7C89AE">オムそば</text>
    </svg>
  </div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-row">
      <div class="thumb">🍚</div>
      <div>
        <h2>ガパオライス</h2>
        <div class="diff">チャーハンの炒め技はそのまま。ナンプラーとバジルでタイの味に。</div>
        <div class="meta">🕒 20分 ・ あと必要なもの: バジル</div>
      </div>
    </div>
    <button class="cta">詳しく見る</button>
  </div>

  <nav>
    <div><span class="ic">🔍</span>探す</div>
    <div><span class="ic">🏠</span>ホーム</div>
    <div class="on"><span class="ic">📖</span>料理帳</div>
  </nav>
</body>
</html>
